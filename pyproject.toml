[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tentacletk"
dynamic = ["version", "readme"]
description = "Marking menus (pie menus) and tool panels for Maya and Blender: one hotkey-driven Qt interface for modeling, UV, animation and export."
keywords = ["m3trik", "marking-menu", "pie-menu", "radial-menu", "maya", "blender", "blender-addon", "hotkeys", "technical-art"]
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

# Dependencies - exclude optional system deps (Pillow, qtpy, numpy, shiboken6)
# The DCC ENGINES are not here: Maya and Blender install into separate
# interpreters (mayapy / Blender's bundled python), each imports exactly one
# engine, and neither toolkit imports the other -- so a hard pin on both put
# ~19 MB of never-imported code into every install. They are extras instead
# (below), and the version floors still live in ONE place: push.ps1's pin sync
# regexes the whole file, so `$REQUIRED_PINS` and the engine -> tentacle
# release cascade keep working with no tooling change.
dependencies = [
    # 0.9.25 / 1.3.85 floors: slots/_slots.py::gate_on_app reads AppSpec.available
    # (0.9.25) and calls sb.gate (1.3.85) on one line, so every panel's
    # availability gate breaks on a floor-satisfying install.
    "pythontk>=0.20.0",
    "uitk>=1.10.0",
]

# One extra per DCC, and each key MUST equal its `Tcl.HOSTS` key -- that
# identity is the whole design: `Tcl.host()` already names the running DCC, so
# it doubles as the extra resolver with no second table to drift (see
# `Tcl.declared_dists`, and the contract test in
# test/test_tcl_launcher.py::TestEngineExtrasContract that fails if a key here
# stops matching a host).
#     mayapy.exe   -m pip install "tentacletk[maya]"
#     blender-py   -m pip install "tentacletk[blender]"
[project.optional-dependencies]
# Engine floors track the same release as the core pins: gate_on_app reaches
# mtk./btk.<Bridge>.APP, and the AppSpec collapse that introduced APP lands in
# mayatk 0.13.54 / blendertk 0.5.74 -- the engines published beside this one.
maya = ["mayatk>=0.31.0"]
blender = ["blendertk>=0.23.1"]
# The standalone-apps product the menus open by name (Tcl.register_apps): the
# floor is the first extapps shipping the apps, the cap the next minor, and
# push.ps1 ratchets both on each release ($STANDALONE_RANGES).
apps = ["extapps>=0.8.0,<0.9"]

[project.urls]
Homepage = "https://github.com/m3trik/tentacle"
Repository = "https://github.com/m3trik/tentacle"
Changelog = "https://github.com/m3trik/tentacle/blob/main/CHANGELOG.md"
Issues = "https://github.com/m3trik/tentacle/issues"

# Record hooks (pythontk ``SceneRecords.registered_hooks``): the libraries' FBX
# exporters and record stores merge these under their own rows, read from this
# metadata alone, so a batch export finds a tool without importing tentacle.
# ``<host>.<role>.<key>`` = ``module:Owner.method``.
[tool.setuptools.dynamic]
version = {attr = "tentacle.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tentacle*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.json", "*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".", "test"]
addopts = "--ignore=test/temp_tests"

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py39"

[tool.ruff.format]
# docs/parity_map.py is a hand-formatted ledger - one grep-able line per entry,
# which the formatter would explode into multi-line dicts (measured: 1114 lines ->
# 1670), breaking the greppability the sweep tools and every triage pass rely on.
# This guards the directory walk (`ruff format .`); ruff still formats a path
# named explicitly on the command line unless --force-exclude is passed. Lint is
# unaffected and still runs on the file.
exclude = ["docs/parity_map.py"]

[tool.ruff.lint]
# E4/E7/E9/F: the house set. The rest are the layout's guardrails (CODE_STANDARD
# section 3): small objects (C901, PLR0904, PLR0915), Qt only through qtpy and no
# PyMEL (TID251), no print (T201). They hold on the new layout -- the shared
# tools' slots/tools/ and the composed slots -- and unmoved code sits in the per-file ignores
# below, which shrink as each tool or category moves.
select = ["E4", "E7", "E9", "F", "C901", "PLR0904", "PLR0915", "TID251", "T201"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports
# PLR0904 is a preview rule: explicit-preview-rules turns on only the preview
# rules selected by code, so the stable rules behave as before (measured
# 2026-10-26: the same 56 E/F findings with and without).
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-public-methods = 60
max-statements = 100

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PySide6".msg = "Qt only through qtpy (CODE_STANDARD section 4)"
"PySide2".msg = "Qt only through qtpy (CODE_STANDARD section 4)"
"PyQt5".msg = "Qt only through qtpy (CODE_STANDARD section 4)"
"PyQt6".msg = "Qt only through qtpy (CODE_STANDARD section 4)"
"pymel".msg = "No PyMEL: maya.cmds only"

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
# The launcher writes to the host console (Maya's "# Warning: ... #" lines, Blender's
# console before any logger exists).
"tentacle/tcl*.py" = ["C901", "T201"]
# A bootstrap: it runs before qtpy is installed, and prints to the host console.
"tentacle/tentacle_installer.py" = ["C901", "PLR0904", "PLR0915", "T201", "TID251"]
"test/**" = ["C901", "PLR0904", "PLR0915", "T201"]
"docs/**" = ["C901", "PLR0904", "PLR0915", "T201"]

[tool.m3trik.layers]
# CODE_STANDARD section 0 (Parts): this package's parts, top first. A module may
# import its own part or any part below it; "a | b" makes peers of one rank.
# Checked by m3trik/scripts/check_layers.py against a frozen baseline of today's
# exceptions. tentacle holds only the launcher, the UIs and the Slots classes.
order = [
    # Blender's add-on stub, over the one launcher.
    "tcl_blender",
    # The one launcher: builds every host's menu and injects its toolkit.
    "tcl",
    "slots | ui",
]

[tool.m3trik.roles.groups]
# Import groups the layout's roles forbid (CODE_STANDARD section 3), as dotted
# roots: "maya" covers maya.cmds, never mayatk.
maya = ["maya", "pymel", "mayatk"]
blender = ["bpy", "bmesh", "mathutils", "blendertk"]
qt = ["qtpy", "uitk", "PySide6", "PySide2", "shiboken6", "shiboken2"]
ui = ["tentacle.ui", "tentacle.slots"]
entry = ["tentacle.tcl", "tentacle.tcl_blender"]

[tool.m3trik.roles.forbid]
# Strict from the first file, never frozen; the most specific path wins. A Slots
# class (composed category or shared tool) reaches its host only through
# self.tk, the host library's API.
"slots" = ["maya", "blender", "entry"]
