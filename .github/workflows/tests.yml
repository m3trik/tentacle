name: Tests

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PySide6 <6.11 for the same reason uitk pins it: 6.11 segfaults during
          # pytest cleanup on the offscreen QPA. Installed first so the editable
          # install below keeps it (pip does not upgrade a satisfied requirement).
          pip install pytest qtpy 'PySide6<6.11'
          # WITH deps, in a retry loop. pip resolves the floors declared in
          # pyproject.toml (`pythontk>=X`), so a stale PyPI CDN edge that still
          # lists the previous release fails LOUDLY with "No matching
          # distribution" and is retried -- instead of silently installing the
          # old version and running this suite against code that lacks the new
          # symbols. Measured 2026-08-23: the bare-name install resolved
          # pythontk 0.9.28 82 s after 0.9.30 was uploaded, and the only failure
          # was two tests importing symbols that exist only in 0.9.30.
          # --no-cache-dir: pip's HTTP cache can hold the stale index page too.
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir -e ".[maya]"; then break; fi
            if [ "$attempt" -lt 6 ]; then
              echo "::warning::editable install attempt $attempt failed (index propagation lag?); retrying in 30s"
              sleep 30
            else
              echo "::error::editable install failed after $attempt attempts"
              exit 1
            fi
          done
          # [maya] only: the [blender] extra would install blendertk, whose lazy
          # bpy imports succeed on ubuntu and un-skip test_blender_menu_nav.py,
          # which has never run in CI. Add it in its own PR after a headless
          # local run of that file.

      - name: Compile UI files (pyside6-uic)
        # _ui.py files are gitignored build artifacts. Generate them so
        # test_ui_integrity (which checks .ui <-> _ui.py pairing) and any
        # product code that imports compiled UI works in CI.
        run: |
          while IFS= read -r ui; do
            pyside6-uic "$ui" -o "${ui%.ui}_ui.py"
          done < <(find tentacle/ui -name '*.ui')
          echo "Compiled $(find tentacle/ui -name '*_ui.py' | wc -l) UI files"

      - name: Run tests
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          OUTPUT=$(pytest --tb=short -v test/ 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"

          PASSED=$(echo "$OUTPUT" | grep -oP '\d+(?= passed)' || echo "0")
          FAILED=$(echo "$OUTPUT" | grep -oP '\d+(?= failed)' || echo "0")
          ERRORS=$(echo "$OUTPUT" | grep -oP '\d+(?= error)' || echo "0")
          PASSED=${PASSED:-0}
          FAILED=${FAILED:-0}
          ERRORS=${ERRORS:-0}

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

  parity:
    # Static Maya<->Blender parity gate. Every UI delta must be fixed or
    # ledgered in docs/parity_map.py — an UNTRIAGED delta exits 1. The
    # comparer lives in the m3trik repo and expects the monorepo layout
    # (tentacle/, mayatk/, blendertk/ as siblings of m3trik/), so the
    # sibling repos are checked out at dev alongside this one.
    # See docs/PARITY_PORTING_PLAN.md for the system overview.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tentacle

      - uses: actions/checkout@v4
        with:
          repository: m3trik/mayatk
          ref: dev
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          path: mayatk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/blendertk
          ref: dev
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          path: blendertk

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          path: m3trik

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parity sweep (fix-or-ledger gate)
        # --write regenerates PARITY_SURFACE.md; the git diff then also
        # fails the job if the committed doc is stale.
        run: |
          python m3trik/scripts/compare_panel_surface.py --all --write
          git -C tentacle diff --exit-code -- docs/PARITY_SURFACE.md

      - name: Parity audit up-to-date
        # mtimes are meaningless in a fresh checkout, so skip the
        # mtime-based registry-freshness guard; --check still
        # content-diffs the committed PARITY_AUDIT.md.
        run: python m3trik/scripts/generate_parity_audit.py --check --allow-stale

  api-registry:
    # Content-hash staleness gate for the committed API_INDEX.md /
    # API_REGISTRY.md (root CLAUDE.md documents --check as the CI gate; before
    # this it was wired into no workflow). Its own job because the generator
    # lives in the m3trik repo and expects the monorepo layout - <pkg>/ and
    # m3trik/ as siblings - so the repos are checked out into sibling paths,
    # the same shape tentacle's parity job uses. pythontk is checked out for
    # one stdlib file: it owns the SymbolRecord DTO the generator loads from
    # source (SSoT for the registry's symbol shape).
    #
    # AST-only: no package install, no DCC, no git history. Deterministic in a
    # fresh checkout because --check hashes CONTENT, not mtimes, and normalizes
    # away the generation date and #L line numbers (see StalenessGate) - only a
    # real public-surface delta fails this.
    name: API registry up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: tentacle

      - uses: actions/checkout@v4
        with:
          repository: m3trik/m3trik
          ref: main
          path: m3trik

      - uses: actions/checkout@v4
        with:
          repository: m3trik/pythontk
          ref: dev
          path: pythontk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Registry matches source
        run: python m3trik/scripts/generate_api_registry.py tentacle --check
